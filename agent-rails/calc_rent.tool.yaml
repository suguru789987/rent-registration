# 決定論的計算ツール契約: calc_rent（演算分離層）
# 由来: mock/spec.md §6 計算ロジック
# 原則: LLM/エージェントに算術をさせない。賃料額はこのツール(決定論)が返す
version: 0
status: poc  # tiered の段階方式は要本人確認

tool: calc_rent
description: 月別地代家賃を賃料体系・上書き・売上から決定論的に算出する

input:
  rent_type: { enum: [fixed, variable, tiered] }
  override:
    override_type: { enum: [direct, params, none] }
    direct_amount: { type: number, optional: true }   # direct時
    # params時の上書き値（null可=デフォルトにフォールバック）
    fixed_rent: { type: number, nullable: true }
    commission_rate: { type: number, nullable: true }
    threshold: { type: number, nullable: true }
    sales_rate: { type: number, nullable: true }
    min_guarantee: { type: number, nullable: true }
  defaults:        # 店舗情報>賃料設定 から解決
    fixed_rent: number
    commission_rate: number
    threshold: number
    sales_rate: number
    min_guarantee: number
    condition_select: { enum: [合算, 最大値選択] }
    tiers: { type: list, optional: true }   # tiered時
  monthly_sales: { type: number }            # 予測=予算 / 確定=実績

output:
  rent_amount: { type: number, unit: JPY }
  breakdown: { type: object }   # 内訳（fixed/commission/min_guaranteeのどれが効いたか）

# ---- 算出ロジック（mock/spec.md §6 を機械可読化）----
logic: |
  # 優先度1: direct 上書き
  if override.override_type == "direct":
      return override.direct_amount

  # パラメータ解決（上書き値 ?? デフォルト）
  fixed_rent    = override.fixed_rent    ?? defaults.fixed_rent
  comm_rate     = override.commission_rate ?? defaults.commission_rate
  threshold     = override.threshold      ?? defaults.threshold     ?? 0
  sales_rate    = override.sales_rate     ?? defaults.sales_rate    ?? 100
  min_guarantee = override.min_guarantee  ?? defaults.min_guarantee ?? 0

  if rent_type == "fixed":
      return MAX(fixed_rent, min_guarantee)

  if rent_type == "variable":
      target_sales = monthly_sales * sales_rate / 100
      commission   = MAX(target_sales - threshold, 0) * comm_rate / 100
      if defaults.condition_select == "合算":      subtotal = fixed_rent + commission
      if defaults.condition_select == "最大値選択": subtotal = MAX(fixed_rent, commission)
      return MAX(subtotal, min_guarantee)

  if rent_type == "tiered":
      # 【要確認】段階方式が marginal(限界)か total(総額)か未確定。下記は marginal 仮定
      target_sales = monthly_sales * sales_rate / 100
      commission = sum over tiers of: (この段に入る売上) * tier.rate / 100
      subtotal   = fixed_rent + commission
      return MAX(subtotal, min_guarantee)

invariants:   # 出力が満たすべき不変条件（guardrailsでも再掲）
  - rent_amount >= 0
  - rent_amount >= min_guarantee   # 最低保証は必ず満たす
